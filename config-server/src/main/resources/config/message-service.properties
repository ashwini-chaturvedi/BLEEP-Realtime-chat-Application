spring.application.name=message-service
server.port=8083
spring.data.mongodb.uri=mongodb://localhost:27017/Chats
spring.data.mongodb.database=Chats
spring.devtools.restart.enabled=true
# Eureka client configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}

# --- RabbitMQ Connection ---
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest

# --- Exchanges Used by the System ---
rabbitmq.exchange.new-messages=new-messages-exchange
rabbitmq.exchange.saved-messages=saved-messages-exchange

# --- Queue This Service Listens To ---
rabbitmq.queue.new-messages=q.new-messages

# --- Routing Keys ---
# Key to SUBSCRIBE to new messages
rabbitmq.routing-key.new=message.new
# Key to PUBLISH saved messages
rabbitmq.routing-key.saved=message.saved
