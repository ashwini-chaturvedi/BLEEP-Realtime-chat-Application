<svg width="256px" height="256px" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="0;1" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1c2c"/>
      <stop offset="100%" stop-color="#928dab"/>
    </linearGradient>

    <linearGradient id="sideGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#434343"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <radialGradient id="dot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </radialGradient>

    <radialGradient id="dot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7efff5"/>
      <stop offset="60%" stop-color="#32ded4"/>
      <stop offset="100%" stop-color="#01a9b4"/>
    </radialGradient>

    <radialGradient id="dot3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c471f5"/>
      <stop offset="60%" stop-color="#833ab4"/>
      <stop offset="100%" stop-color="#61045f"/>
    </radialGradient>
  </defs>

  <circle cx="512" cy="512" r="500" stroke="white" stroke-width="20" fill="none" filter="url(#glow)" opacity="0.7"/>

  <path d="M896 192H128c-35.3 0-64 28.7-64 64v512c0 35.3 28.7 64 64 64h576.6l191.6 127.7L896 832c35.3 0 64-28.7 64-64V256c0-35.3-28.7-64-64-64z" fill="url(#bgGradient)" filter="url(#glow)"/>

  <path d="M640 512c0-125.4-51.5-238.7-134.5-320H128c-35.3 0-64 28.7-64 64v512c0 35.3 28.7 64 64 64h377.5c83-81.3 134.5-194.6 134.5-320z" fill="url(#sideGradient)" />

  <circle cx="256" cy="512" r="64" fill="url(#dot1)" />
  <circle cx="512" cy="512" r="64" fill="url(#dot2)" />
  <circle cx="768" cy="512" r="64" fill="url(#dot3)" />
</svg>
